# Home Assistant LG Heatpump integration
# LG Therma V R290
# last update: 2026-08-06 Kompressorleistung %

modbus:
  - name: "lg_heatpump"
    type: serial
    port: /dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller-if00-port0
    baudrate: 9600
    bytesize: 8
    method: rtu
    parity: N
    stopbits: 1

    #------------------------------------------
    sensors:
      # Technische Daten
      # Input Register (Function Code 04)
      #------------------------------------------

      - name: "hp_error_code"
        unique_id: "modbus.hp_error_code"
        address: 0 # Input Register 1: Current Error Code (0 = No Error, >0 = LG Error Code)
        input_type: input
        slave: 1
        scan_interval: 10

      - name: "hp_odu_operation_cycle"
        unique_id: "modbus.hp_odu_operation_cycle"
        address: 1 # Input Register 2: Outdoor Unit Operation State (0=Off, 1=Standby, 2=Running, 3=Defrost)
        input_type: input
        slave: 1
        scan_interval: 10

      - name: "hp_inlet_temp"
        unique_id: "modbus.hp_inlet_temp"
        address: 2 # Input Register 3: Entering Water Temperature (Rücklauf)
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_outlet_temp"
        unique_id: "modbus.hp_outlet_temp"
        address: 3 # Input Register 4: Leaving Water Temperature Circuit 1 (Vorlauf HK1)
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_backup_heater_outlet_temp"
        unique_id: "modbus.hp_backup_heater_outlet_temp"
        address: 4 # Input Register 5: Water Temperature after Backup Heater
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_dhw_water_temp"
        unique_id: "modbus.hp_dhw_water_temp"
        address: 5 # Input Register 6: Domestic Hot Water (DHW) Tank Temperature
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_solar_collector_temp"
        unique_id: "modbus.hp_solar_collector_temp"
        address: 6 # Input Register 7: Solar Thermal Collector Temperature
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_technikraum" # As no remote is connected it seems it uses the temp sensor from the IDU
        unique_id: "modbus.hp_temp_technikraum"
        address: 7 # Input Register 8: Room Air Temperature Circuit 1 (Measured at the wired remote controller)
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_flow_rate"
        unique_id: "modbus.hp_flow_rate"
        address: 8 # Input Register 9: Water Flow Rate (Liters per minute)
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: L/min
        device_class: volume_flow_rate
        scan_interval: 10

      - name: "hp_flow_temp_circle_2"
        unique_id: "modbus.hp_flow_temp_circle_2"
        address: 9 # Input Register 10: Leaving Water Temperature Circuit 2 (Vorlauf HK2 nach Mischer)
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_room_air_temp_circuit2_input"
        unique_id: "modbus.hp_room_air_temp_circuit2_input"
        address: 10 # Input Register 11: Room Air Temperature Circuit 2
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_energy_state_input"
        unique_id: "modbus.hp_energy_state_input"
        address: 11 # Input Register 12: Current active SG-Ready / Energy State Profile
        input_type: input
        slave: 1
        scan_interval: 10

      - name: "hp_outside_temp"
        unique_id: "modbus.hp_outside_temp"
        address: 12 # Input Register 13: Outdoor Ambient Air Temperature
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_water_pressure"
        unique_id: "modbus.hp_water_pressure"
        address: 13 # Input Register 14: Hydronic Water Circuit Pressure
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: bar
        device_class: pressure
        scan_interval: 10

      - name: "hp_temp_liquid_gas"
        unique_id: "modbus.hp_temp_liquid_gas"
        address: 16 # Input Register 17: Refrigerant Liquid Pipe Temperature - Scale???
        input_type: input
        slave: 1
        scale: 0.001
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_pipe_out"
        unique_id: "modbus.hp_temp_pipe_out"
        address: 17 # Input Register 18: Refrigerant Gas Pipe Temperature - Scale???
        input_type: input
        slave: 1
        scale: 0.001
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_suction"
        unique_id: "modbus.hp_temp_suction"
        address: 18 # Input Register 19: Compressor Suction Temperature
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_heatgas"
        unique_id: "modbus.hp_temp_heatgas"
        address: 19 # Input Register 20: Compressor Discharge (Heatgas) Temperature
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_before_vaporiser"
        unique_id: "modbus.hp_temp_before_vaporiser"
        address: 20 # Input Register 21: Evaporator In Temperature
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_after_vaporiser"
        unique_id: "modbus.hp_temp_after_vaporiser"
        address: 21 # Input Register 22: Evaporator Out Temperature
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_high_pressure"
        unique_id: "modbus.hp_high_pressure"
        address: 22 # Input Register 23: Condenser High Pressure (Refrigerant)
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: bar
        device_class: pressure
        scan_interval: 10

      - name: "hp_low_pressure"
        unique_id: "modbus.hp_low_pressure"
        address: 23 # Input Register 24: Evaporator Low Pressure (Refrigerant)
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: bar
        device_class: pressure
        scan_interval: 10

      - name: "hp_compressor_rpm"
        unique_id: "modbus.hp_compressor_rpm"
        address: 24 # Input Register 25: Compressor Frequency (Hz). Scaled by 60 to get RPM.
        input_type: input
        slave: 1
        scale: 60
        precision: 0.1
        unit_of_measurement: U/min
        scan_interval: 10

      - name: "hp_ENERGY_INSTANTANEOUS_TOTAL_SYSTEM"
        unique_id: "modbus.hp_ENERGY_INSTANTANEOUS_TOTAL_SYSTEM"
        address: 34 # Input Register 35: Instantaneous Electrical Power Consumption (Total System)
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 10

      - name: "hp_ENERGY_INSTANTANEOUS_TOTAL"
        unique_id: "modbus.hp_ENERGY_INSTANTANEOUS_TOTAL"
        address: 36 # Input Register 37: Instantaneous Electrical Power Consumption (Heatpump Only)
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 10

      - name: "hp_ENERGY_ACCUMULATIVE_TOTAL"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_TOTAL"
        address: 38 # Input Register 39: Cumulative Electrical Energy (Total)
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10
        
      - name: "hp_ENERGY_ACCUMULATIVE_HEAT"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_HEAT"
        address: 40 # Input Register 41: Cumulative Electrical Energy (Space Heating)
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10

      - name: "hp_ENERGY_ACCUMULATIVE_COOL"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_COOL"
        address: 42 # Input Register 43: Cumulative Electrical Energy (Space Cooling)
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10

      - name: "hp_ENERGY_ACCUMULATIVE_DHW"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_DHW"
        address: 44 # Input Register 45: Cumulative Electrical Energy (DHW Heating)
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10

      - name: "hp_COP"
        unique_id: "modbus.hp_COP"
        address: 46 # Input Register 47: Heatpump internal calculated COP
        input_type: input
        slave: 1
        data_type: uint32
        scale: 0.1
        precision: 2
        device_class: power_factor
        scan_interval: 10

      - name: "hp_ENERGY_INSTANTANEOUS_TOTAL_TH"
        unique_id: "modbus.hp_ENERGY_INSTANTANEOUS_TOTAL_TH"
        address: 48 # Input Register 49: Instantaneous Thermal Energy Generation (Yield)
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 10
        
      - name: "hp_ENERGY_ACCUMULATIVE_HEAT_TH"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_HEAT_TH"
        address: 50 # Input Register 51: Cumulative Thermal Energy Yield (Space Heating)
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10

#      - name: "hp_ENERGY_ACCUMULATIVE_COOL_TH"
#        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_COOL_TH"
#        address: 52 # Input Register 53: Cumulative Thermal Energy Yield (Space Cooling)
#        input_type: input
#        slave: 1
#        data_type: uint32
#        precision: 2
#        unit_of_measurement: Wh
#        device_class: energy
#        state_class: total
#        scan_interval: 10

#      - name: "hp_ENERGY_ACCUMULATIVE_DHW_TH"
#        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_DHW_TH"
#        address: 54 # Input Register 55: Cumulative Thermal Energy Yield (DHW Heating)
#        input_type: input
#        slave: 1
#        data_type: uint32
#        precision: 2
#        unit_of_measurement: Wh
#        device_class: energy
#        state_class: total
#        scan_interval: 10

      - name: "hp_product_group"
        unique_id: "modbus.hp_product_group"
        address: 9997 # Input Register 9998: Product Group ID
        input_type: input
        slave: 1
        scan_interval: 60

      - name: "hp_product_info"
        unique_id: "modbus.hp_product_info"
        address: 9998 # Input Register 9999: Product Info/Model ID
        input_type: input
        slave: 1
        scan_interval: 60

      # Holding Register (Function Code 03/06)
      #------------------------------------------

      - name: "hp_operation_mode"
        unique_id: "modbus.hp_operation_mode"
        address: 0 # Holding Register 1 (40001): Target Operation Mode (0=Cooling, 1=Heating, 2=Weather Dep, 3=Auto)
        input_type: holding
        slave: 1
        scan_interval: 10

      - name: "hp_control_method"
        unique_id: "modbus.hp_control_method"
        address: 1 # Holding Register 2 (40002): Temperature Control Method (0=Leaving Water, 1=Entering Water, 2=Room Air)
        input_type: holding
        slave: 1
        scan_interval: 10

      - name: "hp_target_temp_circuit1"
        unique_id: "modbus.hp_target_temp_circuit1"
        address: 2 # Holding Register 3 (40003): Target Water Temperature Circuit 1
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_room_air_temp_circuit1"
        unique_id: "modbus.hp_room_air_temp_circuit1"
        address: 3 # Holding Register 4 (40004): Target Room Air Temperature Circuit 1
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_shift_value_in_auto_mode_circuit1"
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit1"
        address: 4 # Holding Register 5 (40005): Target Temperature Shift Circuit 1 (Auto/Weather mode offset)
        input_type: holding
        slave: 1
        precision: 2 
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_target_temp_circuit2"
        unique_id: "modbus.hp_target_temp_circuit2"
        address: 5 # Holding Register 6 (40006): Target Water Temperature Circuit 2
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_room_air_temp_circuit2"
        unique_id: "modbus.hp_room_air_temp_circuit2"
        address: 6 # Holding Register 7 (40007): Target Room Air Temperature Circuit 2
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_shift_value_in_auto_mode_circuit2"
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit2"
        address: 7 # Holding Register 8 (40008): Target Temperature Shift Circuit 2 (Auto/Weather mode offset)
        input_type: holding
        slave: 1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_dhw_target_temp"
        unique_id: "modbus.hp_dhw_target_temp"
        address: 8 # Holding Register 9 (40009): DHW Target Water Temperature
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_energy_state_input_raw"
        unique_id: "modbus.hp_energy_state_input_raw"
        address: 9 # Holding Register 10 (40010): Write SG-Ready / Energy State Command (Solar surplus override)
        input_type: holding
        slave: 1
        scan_interval: 10

      - name: "hp_compressor_modulation"
        unique_id: "modbus.hp_compressor_modulation"
        address: 23 # Holding Register 24 (40024): Max Compressor Modulation Limit (40-100%) / 0: Not used
        input_type: holding
        slave: 1
        precision: 1
        unit_of_measurement: "%"
        scan_interval: 10

      - name: "hp_power_limitation"
        unique_id: "modbus.hp_power_limitation"
        address: 24 # Holding Register 25 (40025): Max Active Electrical Power Limit (0.1 - 25.0 kW)
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        scan_interval: 10

    # -------------------------------------------------
    switches:
      # coil_register (Function Code 01/05)
      # -------------------------------------------------
      - name: "hp_hauptschalter" 
        unique_id: "modbus.hp_hauptschalter"
        address: 0 # Coil 1: Heatpump Main Power (0=Off, 1=On)
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 0
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_dhw"
        unique_id: "modbus.hp_dhw"
        address: 1 # Coil 2: DHW Operation (0=Off, 1=On)
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 1
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_silent_mode"
        unique_id: "modbus.hp_silent_mode"
        address: 2 # Coil 3: Silent Mode Schedule Override (0=Off, 1=On)
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 2
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_dhw_desinfection_mode"
        unique_id: "modbus.hp_dhw_desinfection_mode"
        address: 3 # Coil 4: Force DHW Legionella Disinfection Cycle
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 3
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_emergency_stop_switch_off" 
        unique_id: "modbus.hp_emergency_stop_switch_off"
        address: 4 # Coil 5: Emergency Operation for Space Heating (0=Off, 1=On)
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 4
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_emergency_stop_switch_on" 
        unique_id: "modbus.hp_emergency_stop_switch_on"
        address: 5 # Coil 6: Emergency Operation for DHW (0=Off, 1=On)
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 5
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_active_power_limit"
        unique_id: "modbus.hp_active_power_limit"
        address: 6 # Coil 7: Toggle Active Power Limitation (Uses value from Holding Reg 25)
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 6
          input_type: coil
          state_on: 1
          state_off: 0

    # -----------------------------------------
    binary_sensors:
      # discrete_input (Function Code 02)
      # -----------------------------------------
      - name: "hp_water_flow_status"
        unique_id: "modbus.hp_water_flow_status"
        address: 0 # Discrete Input 1: Physical Water Flow Switch (0=No Flow, 1=Flow)
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_water_pump_status"
        unique_id: "modbus.hp_water_pump_status"
        address: 1 # Discrete Input 2: Main Water Pump Running State
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_ext_water_pump_status"
        unique_id: "modbus.hp_ext_water_pump_status"
        address: 2 # Discrete Input 3: External Water Pump Running State
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_compressor_status"
        unique_id: "modbus.hp_compressor_status"
        address: 3 # Discrete Input 4: Compressor Running State
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_defrosting_status"
        unique_id: "modbus.hp_defrosting_status"
        address: 4 # Discrete Input 5: Defrost Cycle Active
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_dhw_heating_status"
        unique_id: "modbus.hp_dhw_heating_status"
        address: 5 # Discrete Input 6: DHW Heating Cycle Active
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_dhw_tank_desinfection_status"
        unique_id: "modbus.hp_dhw_tank_desinfection_status"
        address: 6 # Discrete Input 7: DHW Disinfection Cycle Active
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_silent_mode_status"
        unique_id: "modbus.hp_silent_mode_status"
        address: 7 # Discrete Input 8: Silent Mode Active (Feedback)
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_cooling_status"
        unique_id: "modbus.hp_cooling_status"
        address: 8 # Discrete Input 9: Cooling Mode Active
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_solar_pump_status"
        unique_id: "modbus.hp_solar_pump_status"
        address: 9 # Discrete Input 10: Solar Thermal Pump Running State
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_backup_heater_step1_status"
        unique_id: "modbus.hp_backup_heater_step1_status"
        address: 10 # Discrete Input 11: Inline Backup Heater Step 1 Active
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_backup_heater_step2_status"
        unique_id: "modbus.hp_backup_heater_step2_status"
        address: 11 # Discrete Input 12: Inline Backup Heater Step 2 Active
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_dhw_boost_heater_status"
        unique_id: "modbus.hp_dhw_boost_heater_status"
        address: 12 # Discrete Input 13: DHW Tank Flange/Boost Heater Active
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_error_status"
        unique_id: "modbus.hp_error_status"
        address: 13 # Discrete Input 14: General Error Flag (1=Error present)
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_emergency_operation_available_space_heating/cooling"
        unique_id: "modbus.hp_emergency_operation_available_space_heating_cooling"
        address: 14 # Discrete Input 15: Emergency Space Heating is physically available/configured
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_emergency_operation_available_dhw"
        unique_id: "modbus.hp_emergency_operation_available_dhw"
        address: 15 # Discrete Input 16: Emergency DHW Heating is physically available/configured
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_mix_pump_status"
        unique_id: "modbus.hp_mix_pump_status"
        address: 16 # Discrete Input 17: Mixing Circuit 2 Pump Status
        input_type: discrete_input
        slave: 1
        scan_interval: 10

input_number:
  # Input Number
  # -----------------------------------------
  hp_shift_value_in_auto_mode_circuit1:
    name: "Set HP Sollwertverschiebung im AI Modus - HK1 (Heizkörper)"
    min: -5
    max: 5
    step: 1

  hp_shift_value_in_auto_mode_circuit2:
    name: "Set HP Sollwertverschiebung im AI Modus - HK2 (Fußbodenheizung)"
    min: -5
    max: 5
    step: 1

  hp_hk1_target_temperatur:
    name: "Soll Temperatur HK1 #Zieltemperatur HK1 Heizkörper"
    min: 20
    max: 60
    step: 1

  hp_hk2_target_temperatur:
    name: "Soll Temperatur HK2 #Zieltemperatur HK2Fußbodenheizung"
    min: 20
    max: 40
    step: 1

  hp_dhw_target_temperatur:
    name: "Soll Temperatur DHW"
    min: 40
    max: 60
    step: 1

  hp_power_limitation_slider:
    name: "Max Electrical Power Limit in kW"
    min: 0.1
    max: 25.0
    step: 0.1
    unit_of_measurement: "kW"
    mode: slider
    icon: mdi:flash

  hp_compressor_modulation_slider:
    name: "Max Compressor Modulation in %"
    min: 40
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:engine-outline
  

input_select:
  # Input Select
  # -----------------------------------------
  hp_set_operation_mode:
    name: "Selector Heatpump Operation Mode"
    options:
      - "Kühlen"
      - "Heizen"
      - "Auto"

  hp_set_control_method:
    name: "Selector Heatpump Control Method"
    options:
      - "Wasserauslasstemp. Steuerung"
      - "Wassereinlasstemp. Steuerung"
      - "Raumluftsteuerung"

template:
  # Template sensors for better readability
  #-----------------------------------------
  - sensor:
      - name: "HP Energy State"
        unique_id: "hp_energy_state_label"
        state: >
            {% set v = states('sensor.hp_energy_state_input_raw') | int(-1) %}
            {% if v == 0 %} Nicht verwenden
            {% elif v == 1 %} Erzwungen Aus
            {% elif v == 2 %} Normalbetrieb
            {% elif v == 3 %} Ein-Empfehlung
            {% elif v == 4 %} Ein-Befehl
            {% elif v == 5 %} Ein-Befehl Schritt 2
            {% elif v == 6 %} Ein-Empfehlung Schritt 1
            {% elif v == 7 %} Energiesparmodus
            {% elif v == 8 %} Superenergiesparmodus
            {% else %} Unknown
            {% endif %}

- sensor:
      - name: "HP Heating COP (Calculated)"
        unique_id: "hp_heating_cop_calculated"
        unit_of_measurement: "COP"
        state_class: measurement
        state: >
          {% set thermal = states('sensor.hp_energy_accumulative_heat_th') | float(0) %}
          {% set electrical = states('sensor.hp_energy_accumulative_heat') | float(0) %}
          {% if electrical > 0 %}
            {{ (thermal / electrical) | round(2) }}
          {% else %}
            0
          {% endif %}
          
#      - name: "HP DHW COP (Calculated)"
#        unique_id: "hp_dhw_cop_calculated"
#        unit_of_measurement: "COP"
#        state_class: measurement
#        state: >
#          {% set thermal = states('sensor.hp_energy_accumulative_dhw_th') | float(0) %}
#          {% set electrical = states('sensor.hp_energy_accumulative_dhw') | float(0) %}
#          {% if electrical > 0 %}
#            {{ (thermal / electrical) | round(2) }}
#          {% else %}
#            0
#          {% endif %}

# ---------------------------------------------------------------------------------------------------------------
# Automations: Write modbus registers on input changes via GUI
# note: If you change a value by the sliders, it will take up to 60 seconds until the state variables are updated
# ---------------------------------------------------------------------------------------------------------------

automation:
  ### Input Select Operation Mode ###
  #-------------------------------------------------------------------------------
  - id: "hp_automation_operation_mode_modbus_update"
    alias: "[Heatpump] Operation Mode Modbus Update"
    description: "Select Operation Mode of Heatpump - send via Modbus"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - input_select.hp_set_operation_mode
    condition: []
    variables:
      kuehlen: 0
      auto: 3
      heizen: 4
    action:
      - action: modbus.write_register
        data:
          hub: lg_heatpump
          slave: 1
          address: 0
          value: >-
            {% if is_state('input_select.hp_set_operation_mode', 'Kühlen') %} {{kuehlen}}
            {% elif is_state('input_select.hp_set_operation_mode', 'Heizen') %} {{heizen}}
            {% else %}
            {{auto}}
            {% endif %}

  - id: "hp_automation_operation_mode_input_select_update"
    alias: "[Heatpump] Operation Mode InputSelect Update"
    description: "Select Operation Mode of Heatpump - Read from State"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - sensor.hp_operation_mode
    condition: []
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.hp_set_operation_mode
        data:
          option: >
            {% if is_state('sensor.hp_operation_mode', '3') %}
            Auto
            {% elif is_state('sensor.hp_operation_mode', '4') %}
            Heizen
            {% else %}
            Kühlen
            {% endif %}

  ### Input Select Control Mode ###
  #-------------------------------------------------------------------------------

  - id: "hp_automation_control_method_modbus_update"
    alias: "[Heatpump] Control Method Modbus Update"
    description: "Select Control Method of Heatpump - send via Modbus"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - input_select.hp_set_control_method
    condition: []
    variables:
      auslass: 0
      einlass: 1
      raumluft: 2
    action:
      - action: modbus.write_register
        data:
          hub: lg_heatpump
          slave: 1
          address: 1
          value: >-
            {% if is_state('input_select.hp_set_control_method', 'Wasserauslasstemp. Steuerung') %}
            {{auslass}}
            {% elif is_state('input_select.hp_set_control_method', 'Wassereinlasstemp. Steuerung') %}
            {{einlass}}
            {% else %}
            {{raumluft}}
            {% endif %}

  - id: "hp_automation_control_method_input_select_update"
    alias: "[Heatpump] Control Method InputSelect Update"
    description: "Select Control Method of Heatpump - Read from State"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - sensor.hp_control_method
    condition: []
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.hp_set_control_method
        data:
          option: >
            {% if is_state('sensor.hp_control_method', '0') %}
            Wasserauslasstemp. Steuerung
            {% elif is_state('sensor.hp_control_method', '1') %}
            Wassereinlasstemp. Steuerung
            {% else %}
            Raumluftsteuerung
            {% endif %}

  ### Sollwertverschiebung von Heizkreis 1 (Heizkörper)###
  #-------------------------------------------------------------------------------

  - id: "hp_automation_set_shift_value_in_auto_mode_circuit1_modbus_update"
    alias: "hp_automation_set_shift_value_in_auto_mode_circuit1_modbus_update"
    description: "Änderung der Vorlauftemperatur HK1 im AI Modus auf Modbus schreiben"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - input_number.hp_shift_value_in_auto_mode_circuit1
    condition: []
    action:
      - action: modbus.write_register
        data:
          hub: lg_heatpump
          slave: 1
          address: 4
          value: >
            {% if states('input_number.hp_shift_value_in_auto_mode_circuit1') | int(default=0) < 0 %}
            {{states('input_number.hp_shift_value_in_auto_mode_circuit1') | int + 65536 }}
            {% else %}
            {{states('input_number.hp_shift_value_in_auto_mode_circuit1') | int }}
            {% endif %}

  - id: "hp_automation_set_shift_value_in_auto_mode_circuit1_input_slider_update"
    alias: "hp_automation_set_shift_value_in_auto_mode_circuit1_input_slider_update"
    description: "Änderung der Vorlauftemperatur HK1 im AI Modus auf Input Slider schreiben"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - sensor.hp_shift_value_in_auto_mode_circuit1
    condition: []
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.hp_shift_value_in_auto_mode_circuit1
        data:
