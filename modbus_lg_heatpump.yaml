### Kompressor Drehzahl Vorgabe ###
  #-------------------------------------------------------------------------------

  - id: "hp_automation_set_hp_comp_target_percent_modbus_update"
    alias: "[Heat Pump] Write Compressor Modulation Limit"
    description: "Sends the slider value to Modbus Address 23"
    mode: single
    trigger:
      - platform: state
        entity_id: input_number.hp_compressor_modulation_slider
    action:
      - action: modbus.write_register
        data:
          hub: lg_heatpump
          slave: 1
          address: 23
          value: "{{ states('input_number.hp_compressor_modulation_slider') | int(0) }}"

  - id: "hp_compressor_mod_sync"
    alias: "[Heat Pump] Sync Compressor Modulation Slider"
    description: "Updates the slider if the Modbus sensor changes"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.hp_compressor_modulation
    condition:
      - condition: template
        value_template: "{{ states('sensor.hp_compressor_modulation') | int(0) != states('input_number.hp_compressor_modulation_slider') | int(0) }}"
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.hp_compressor_modulation_slider
        data:
          value: "{{ states('sensor.hp_compressor_modulation') | int(0) }}"

  ### Power Limit Vorgabe ###
  #-------------------------------------------------------------------------------
  
  - id: "hp_power_limit_write"
    alias: "[Heat Pump] Write Power Limit"
    description: "Sends the slider value to Modbus Address 24"
    mode: single
    trigger:
      - platform: state
        entity_id: input_number.hp_power_limitation_slider
    action:
      - action: modbus.write_register
        data:
          hub: lg_heatpump
          slave: 1
          address: 24
          value: "{{ (states('input_number.hp_power_limitation_slider') | float(0) * 10) | int }}"

  - id: "hp_power_limit_sync"
    alias: "[Heat Pump] Sync Power Limit Slider"
    description: "Updates the slider if the Modbus sensor changes"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.hp_power_limitation
    condition:
      - condition: template
        value_template: "{{ states('sensor.hp_power_limitation') | float(0) != states('input_number.hp_power_limitation_slider') | float(0) }}"
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.hp_power_limitation_slider
        data:
          value: "{{ states('sensor.hp_power_limitation') | float(0) }}"
